<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y brillo -->
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
    <filter id="glow-ice" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes de Fondo Cálido Fast-Casual -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="60.1%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Textura de madera para la mesa -->
    <linearGradient id="wood-table" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="30%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Botella 1: Naranja / Aranciata Italiana (Cálida) -->
    <linearGradient id="glass-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#fdba74" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#f97316" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.95" />
    </linearGradient>

    <!-- Botella 2: Verde Agua Mineral / Lima Frizzante -->
    <linearGradient id="glass-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#6ee7b7" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.95" />
    </linearGradient>

    <!-- Botella 3: Cola Clásica / Té Frío Ámbar -->
    <linearGradient id="glass-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#78350f" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#b45309" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#78350f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#271102" stop-opacity="0.98" />
    </linearGradient>

    <!-- Reflejo brillante de cristal -->
    <linearGradient id="shine-vertical" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Cubitos de Hielo -->
    <linearGradient id="ice-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Fondo de restaurante / Barra de mostrador -->
  <rect width="800" height="450" fill="url(#bg-grad)" />

  <!-- Mesa rústica de madera en perspectiva -->
  <polygon points="0,320 800,320 800,450 0,450" fill="url(#wood-table)" />
  <line x1="0" y1="320" x2="800" y2="320" stroke="#fcd34d" stroke-opacity="0.3" stroke-width="2" />

  <!-- Gotas y charcos suaves de condensación en la mesa -->
  <ellipse cx="250" cy="380" rx="60" ry="12" fill="#0f172a" fill-opacity="0.25" />
  <ellipse cx="400" cy="385" rx="65" ry="14" fill="#0f172a" fill-opacity="0.3" />
  <ellipse cx="550" cy="380" rx="60" ry="12" fill="#0f172a" fill-opacity="0.25" />

  <!-- Cubos de Hielo Decorativos alrededor -->
  <!-- Cubo 1 -->
  <g transform="translate(160, 340) rotate(15)" filter="url(#glow-ice)">
    <rect width="36" height="36" rx="6" fill="url(#ice-grad)" stroke="#ffffff" stroke-width="1.5" />
    <path d="M6,6 L30,6 L30,30" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6" />
  </g>
  <!-- Cubo 2 -->
  <g transform="translate(470, 355) rotate(-10)" filter="url(#glow-ice)">
    <rect width="32" height="32" rx="5" fill="url(#ice-grad)" stroke="#ffffff" stroke-width="1.5" />
  </g>
  <!-- Cubo 3 -->
  <g transform="translate(630, 345) rotate(25)" filter="url(#glow-ice)">
    <rect width="34" height="34" rx="5" fill="url(#ice-grad)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Rodaja de Limón / Lima Fresca -->
  <g transform="translate(325, 335) rotate(-20)">
    <circle cx="20" cy="20" r="24" fill="#84cc16" stroke="#4d7c0f" stroke-width="3" />
    <circle cx="20" cy="20" r="20" fill="#bef264" />
    <path d="M20,20 L20,4 M20,20 L34,10 M20,20 L34,30 M20,20 L20,36 M20,20 L6,30 M20,20 L6,10" stroke="#4d7c0f" stroke-width="1.5" />
  </g>

  <!-- =========================================================================
       BOTELLA 1 (IZQUIERDA): SODA ITALIANA DE NARANJA (ARANCIATA)
       ========================================================================= -->
  <g transform="translate(200, 70)" filter="url(#shadow-soft)">
    <!-- Cuello y Pico -->
    <path d="M42,20 L58,20 L56,70 C56,100 80,120 86,140 L86,285 C86,295 78,305 66,305 L34,305 C22,305 14,295 14,285 L14,140 C20,120 44,100 44,70 Z" 
          fill="url(#glass-orange)" />
    
    <!-- Brillo vertical de cristal -->
    <path d="M46,70 C46,95 32,120 26,140 L26,285 C26,292 30,298 38,298 L44,298 L44,70 Z" 
          fill="url(#shine-vertical)" opacity="0.6" />

    <!-- Etiqueta Minimalista Noodles Refresh -->
    <rect x="18" y="170" width="64" height="65" rx="4" fill="#ffffff" opacity="0.95" />
    <rect x="22" y="174" width="56" height="57" rx="2" fill="none" stroke="#f97316" stroke-width="1.5" />
    <text x="50" y="196" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#ea580c" text-anchor="middle">NOODLES</text>
    <text x="50" y="210" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="bold" fill="#334155" text-anchor="middle">ARANCIATA</text>
    <text x="50" y="222" font-family="'Segoe UI', sans-serif" font-size="6.5" fill="#64748b" text-anchor="middle">500ml • FRESCA</text>

    <!-- Tapa metálica corona -->
    <path d="M40,14 L60,14 L62,20 L38,20 Z" fill="#ea580c" stroke="#9a3412" stroke-width="1" />

    <!-- Gotitas de condensación fría -->
    <circle cx="30" cy="150" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="33" cy="155" r="1.8" fill="#ffffff" opacity="0.7" />
    <circle cx="70" cy="165" r="2.2" fill="#ffffff" opacity="0.8" />
    <circle cx="28" cy="250" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="29" cy="258" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="72" cy="265" r="2.5" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- =========================================================================
       BOTELLA 2 (CENTRAL): AGUA MINERAL PURA / LIMA NATURAL
       ========================================================================= -->
  <g transform="translate(350, 45)" filter="url(#shadow-soft)">
    <!-- Silueta elegante -->
    <path d="M42,20 L58,20 L56,75 C56,105 84,125 90,145 L90,310 C90,320 80,330 68,330 L32,330 C20,330 10,320 10,310 L10,145 C16,125 44,105 44,75 Z" 
          fill="url(#glass-green)" />

    <!-- Reflejo cristalino -->
    <path d="M46,75 C46,100 28,125 22,145 L22,310 C22,318 26,324 34,324 L42,324 L42,75 Z" 
          fill="url(#shine-vertical)" opacity="0.7" />

    <!-- Burbujitas efervescentes dentro de la botella -->
    <circle cx="45" cy="280" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="55" cy="260" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="35" cy="230" r="2.2" fill="#ffffff" opacity="0.8" />
    <circle cx="65" cy="190" r="1.8" fill="#ffffff" opacity="0.6" />
    <circle cx="50" cy="150" r="2" fill="#ffffff" opacity="0.7" />

    <!-- Etiqueta Central Noodles Water -->
    <rect x="16" y="175" width="68" height="75" rx="5" fill="#ffffff" opacity="0.95" />
    <rect x="20" y="179" width="60" height="67" rx="3" fill="none" stroke="#10b981" stroke-width="1.5" />
    <text x="50" y="202" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">NOODLES</text>
    <text x="50" y="218" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">ACQUA PURA</text>
    <text x="50" y="232" font-family="'Segoe UI', sans-serif" font-size="6.8" fill="#64748b" text-anchor="middle">NATURALE &amp; FRIZZANTE</text>
    <text x="50" y="242" font-family="'Segoe UI', sans-serif" font-size="6.5" fill="#10b981" text-anchor="middle">500ml ❄️ EXTRA FRÍA</text>

    <!-- Tapa metálica dorada -->
    <path d="M40,14 L60,14 L62,20 L38,20 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1" />

    <!-- Gotas de condensación -->
    <circle cx="24" cy="160" r="2.8" fill="#ffffff" opacity="0.9" />
    <circle cx="26" cy="167" r="1.8" fill="#ffffff" opacity="0.7" />
    <circle cx="78" cy="180" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="79" cy="189" r="2" fill="#ffffff" opacity="0.6" />
    <circle cx="28" cy="275" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="75" cy="285" r="2.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- =========================================================================
       BOTELLA 3 (DERECHA): COLA & TÉ FRÍO ARTESANAL
       ========================================================================= -->
  <g transform="translate(500, 70)" filter="url(#shadow-soft)">
    <!-- Silueta -->
    <path d="M42,20 L58,20 L56,70 C56,100 80,120 86,140 L86,285 C86,295 78,305 66,305 L34,305 C22,305 14,295 14,285 L14,140 C20,120 44,100 44,70 Z" 
          fill="url(#glass-dark)" />

    <!-- Brillo vertical -->
    <path d="M46,70 C46,95 32,120 26,140 L26,285 C26,292 30,298 38,298 L44,298 L44,70 Z" 
          fill="url(#shine-vertical)" opacity="0.55" />

    <!-- Etiqueta Vintage Noodles Cola -->
    <rect x="18" y="170" width="64" height="65" rx="4" fill="#ffffff" opacity="0.95" />
    <rect x="22" y="174" width="56" height="57" rx="2" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <text x="50" y="196" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#dc2626" text-anchor="middle">NOODLES</text>
    <text x="50" y="210" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">COLA ZERO</text>
    <text x="50" y="222" font-family="'Segoe UI', sans-serif" font-size="6.5" fill="#64748b" text-anchor="middle">SABOR CLÁSICO 500ml</text>

    <!-- Tapa metálica roja -->
    <path d="M40,14 L60,14 L62,20 L38,20 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1" />

    <!-- Gotas de hielo y vapor frío -->
    <circle cx="28" cy="155" r="2.5" fill="#ffffff" opacity="0.8" />
    <circle cx="74" cy="160" r="2.8" fill="#ffffff" opacity="0.8" />
    <circle cx="26" cy="260" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="76" cy="270" r="2.5" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Banner de Calidad / Frescura Superior -->
  <g transform="translate(400, 26)">
    <rect x="-120" y="0" width="240" height="26" rx="13" fill="#0f172a" opacity="0.85" />
    <text x="0" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      ❄️ BEBIDAS HELADAS 500ML
    </text>
  </g>
</svg>
