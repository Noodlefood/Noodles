<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18" flood-color="#000000" />
    </filter>
    
    <!-- Gradientes de las letras -->
    <linearGradient id="grad-n" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="grad-o1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="grad-o2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="grad-d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <linearGradient id="grad-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="grad-e" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="grad-s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Círculo e Isotipo Central (detrás y entre las letras O-D) -->
    <g transform="translate(270, 118)">
      <!-- Anillo del logo -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#grad-ring)" stroke-width="8" stroke-linecap="round" />
      
      <!-- Hojas de albahaca verde -->
      <path d="M-22,-16 C-30,-32 -8,-36 4,-24 C12,-16 -6,-6 -22,-16 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5" />
      <path d="M-6,-24 C-4,-38 18,-34 16,-18 C14,-6 -2,-14 -6,-24 Z" fill="#16a34a" stroke="#15803d" stroke-width="1.5" />
      
      <!-- Tomatito cherry -->
      <circle cx="22" cy="12" r="10" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
      <path d="M22,2 C20,0 24,-2 22,-5 C20,-2 21,0 22,2 Z" fill="#15803d" />

      <!-- Tenedor de metal con spaguetti enrollado -->
      <path d="M38,-28 L10,-2 L-6,14" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M-4,10 L-14,20 M-8,6 L-18,16 M-12,2 L-22,12" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
      
      <!-- Nido de Spaguetti enrollado al dente -->
      <path d="M-18,2 C-26,-8 2,-16 12,-4 C22,8 4,24 -10,22 C-22,20 -18,2 -2,4 C14,6 18,18 6,24 C-4,28 -14,24 -8,14" 
            fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-10,0 C-18,-6 4,-12 10,-2 C16,8 2,18 -8,16" 
            fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
      <path d="M-4,24 C2,28 6,38 6,48" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Tipografía Noodles Estilo Bubble 3D -->
    <g font-family="'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="78">
      <text x="75" y="102" fill="url(#grad-n)" stroke="#0369a1" stroke-width="2" letter-spacing="-2">N</text>
      <text x="140" y="102" fill="url(#grad-o1)" stroke="#d97706" stroke-width="2" letter-spacing="-2">o</text>
      <text x="195" y="102" fill="url(#grad-o2)" stroke="#0f172a" stroke-width="2" letter-spacing="-2">o</text>
      <text x="250" y="102" fill="url(#grad-d)" stroke="#15803d" stroke-width="2" letter-spacing="-2">d</text>
      <text x="312" y="102" fill="url(#grad-l)" stroke="#b91c1c" stroke-width="2" letter-spacing="-2">l</text>
      <text x="345" y="102" fill="url(#grad-e)" stroke="#1d4ed8" stroke-width="2" letter-spacing="-2">e</text>
      <text x="395" y="102" fill="url(#grad-s)" stroke="#ca8a04" stroke-width="2" letter-spacing="-2">s</text>
      <text x="445" y="60" font-size="20" fill="#64748b" font-weight="bold">®</text>
    </g>

    <!-- Slogan FAST SPAGHETTI & MORE -->
    <text x="270" y="200" 
          font-family="'Arial Black', 'Montserrat', 'Impact', sans-serif" 
          font-weight="900" 
          font-size="20" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#7f1d1d">
      FAST SPAGHETTI &amp; MORE
    </text>
  </g>
</svg>
